# NGINX as a reverse proxy, configured to match Portcullis's work: HTTP/1.1
# keep-alive upstream connections, X-Forwarded-For, no access log.
worker_processes 2;            # matches the 2-CPU container quota (auto would see all VM CPUs)
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 4096; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    upstream single  { server be1:9000; keepalive 256; }
    upstream pair    { server be1:9000 max_fails=1 fail_timeout=5s; server be2:9000 max_fails=1 fail_timeout=5s; keepalive 256; }
    server {
        listen 8080 reuseport;
        location / {
            proxy_pass http://single;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
    server {                   # failure-injection target: two backends, retries on error (the default)
        listen 8081 reuseport;
        location / {
            proxy_pass http://pair;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 1s;
        }
    }
}
