name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x" # newest patch release: govulncheck flags older 1.26 net/http (GO-2026-6859)
          check-latest: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - run: make fmt vet staticcheck
      - run: make test
      - run: make fuzz FUZZTIME=10s
      - run: make vuln
      - run: make build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make docker
