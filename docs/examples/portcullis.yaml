# Example traffic config. Reload with SIGHUP, POST /reload, or PUT it to /config.
version: "2026-11-20.1"
trustedProxies: ["10.0.0.0/8"]

pools:
  - name: web-stable
    lb: p2c
    backends:
      - address: 10.0.1.10:8080
      - address: 10.0.1.11:8080
    healthCheck: {path: /healthz, interval: 5s, timeout: 1s, healthy: 2, unhealthy: 3, jitter: 0.1}
    ejection: {after: 5, for: 30s, max: 5m}
    retries: {attempts: 2, budget: 0.2, burst: 10}

  - name: web-canary
    backends:
      - address: 10.0.2.10:8080

  - name: sessions
    lb: hash
    hashKey: "cookie:session"
    backends:
      - {address: 10.0.3.10:8080, weight: 2}
      - {address: 10.0.3.11:8080}

routes:
  - name: web
    hosts: ["app.example.com"]
    backends:                      # canary: 90/10 split
      - {pool: web-stable, weight: 90}
      - {pool: web-canary, weight: 10}

  - name: cart
    hosts: ["app.example.com"]
    path: /cart
    backends: [{pool: sessions}]

  - name: health-exact
    hosts: ["*.example.com"]
    path: /status
    pathType: Exact
    methods: [GET]
    backends: [{pool: web-stable}]

# PolicyScript (docs/POLICY_LANGUAGE.md): runs on every request to the listed
# routes (omit `routes` for all of them), in order.
policies:
  - routes: [web, cart]
    onError: fail_closed           # a budget breach answers 500 (fail_open: skip the policy)
    script: |
      policy "edge-rules" {
        on request {
          if path.starts_with("/admin") && !(client.ip in ["10.0.0.0/8", "192.168.0.0/16"]) {
            deny(403, "admin is internal only")
          }
          if header("user-agent").contains("sqlmap") { deny(403) }
          if rate_limit(client.ip, 100, "1m") { deny(429) }
          if header("x-canary") == "1" { route_to("web-canary") }
          set_header("x-frame-options", "DENY")
        }
        on response {
          remove_header("server")
        }
      }
